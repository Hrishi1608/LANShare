<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LANShare &mdash; Password required</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="shell">

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <p class="flash">{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="hero">
            <h1>LANShare</h1>
            <p>This file is password protected. Enter the password to download it.</p>

            <form method="POST" action="{{ url_for('shares.access', token=token) }}">
                <input type="password" name="password" placeholder="Password" autofocus required>
                <button type="submit" class="nav-link primary" style="border: none; cursor: pointer;">
                    Download
                </button>
            </form>
        </div>

    </div>

</body>

</html>
